name: Fork test - Backtracing lit tests on Android

on:
  push:
    branches: [fork-test-87445-lit]

permissions:
  actions: read
  contents: read

env:
  SNAPSHOT: swift-DEVELOPMENT-SNAPSHOT-2026-11-01-a

jobs:
  lit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        api: [28, 33]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            test/Backtracing
            utils/android
      - uses: actions/download-artifact@v4
        with:
          name: android-sdk-x86_64
          path: ${{ runner.temp }}/sdk
          run-id: 45385513313
          github-token: ${{ github.token }}
      - name: Install the snapshot toolchain, the SDK and FileCheck
        run: |
          curl -sSL https://download.swift.org/development/ubuntu2404/$SNAPSHOT/$SNAPSHOT-ubuntu24.04.tar.gz | tar -xz -C $HOME
          echo "$HOME/$SNAPSHOT-ubuntu24.04/usr/bin" >> $GITHUB_PATH
          export PATH=$HOME/$SNAPSHOT-ubuntu24.04/usr/bin:$PATH
          swift sdk install $(ls $RUNNER_TEMP/sdk/*.tar.gz)
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME bash $( (find ~/.swiftpm ~/.config/swiftpm -name setup-android-sdk.sh 2>/dev/null || true) | head -1)
          sudo apt-get install -y llvm-18-tools > /dev/null
          ls /usr/lib/llvm-18/bin/FileCheck
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Backtracing tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          emulator-boot-timeout: 600
          script: bash .github/fork-test-87445/lit-like.sh Crash.test CrashNoDebug.test CrashOpt.test CrashWithThunk.test Overflow.test StackOverflow.test
